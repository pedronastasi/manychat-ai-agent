<rect width="711" height="366" rx="8" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="691" y="22" text-anchor="end" class="caption">fixture tenant · mock model · no API key</text>
<text x="20" y="69" class="command-line" style="animation:l0 12040ms infinite"><tspan class="prompt">$</tspan> pnpm simulate "how much is the foundation course?"</text>
<text x="20" y="89" class="contact-line" style="animation:l1 12040ms infinite"><tspan class="contact">  contact   </tspan>how much is the foundation course?</text>
<text x="20" y="109" class="rule-line" style="animation:l2 12040ms infinite">  ------------------------------------------------------------</text>
<text x="20" y="129" class="agent-line" style="animation:l3 12040ms infinite"><tspan class="agent">  agent     </tspan>The Foundation Course is $450.00.</text>
<text x="20" y="149" class="agent-line" style="animation:l4 12040ms infinite">            It runs 24 hours, Tuesdays and Thursdays 6-9pm. Want the link?</text>
<text x="20" y="169" class="rule-line" style="animation:l5 12040ms infinite">  ------------------------------------------------------------</text>
<text x="20" y="189" class="footer-line" style="animation:l6 12040ms infinite">  93ms  |  callback: registered  |  quick_replies: omitted</text>
<text x="20" y="229" class="command-line" style="animation:l8 12040ms infinite"><tspan class="prompt">$</tspan> pnpm simulate "I want to speak to a human"</text>
<text x="20" y="249" class="contact-line" style="animation:l9 12040ms infinite"><tspan class="contact">  contact   </tspan>I want to speak to a human</text>
<text x="20" y="269" class="rule-line" style="animation:l10 12040ms infinite">  ------------------------------------------------------------</text>
<text x="20" y="289" class="agent-line" style="animation:l11 12040ms infinite"><tspan class="agent">  agent     </tspan>Let me put you through to someone on the team who can give you the exact</text>
<text x="20" y="309" class="agent-line" style="animation:l12 12040ms infinite">            answer. They'll reply here shortly.</text>
<text x="20" y="329" class="rule-line" style="animation:l13 12040ms infinite">  ------------------------------------------------------------</text>
<text x="20" y="349" class="footer-line" style="animation:l14 12040ms infinite">  44ms  |  callback: registered  |  quick_replies: omitted</text>
