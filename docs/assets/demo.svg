@keyframes l3{0%,24.09%{opacity:0}24.09%,97%{opacity:1}100%{opacity:0}}
@keyframes l4{0%,24.83%{opacity:0}24.84%,97%{opacity:1}100%{opacity:0}}
@keyframes l5{0%,25.58%{opacity:0}25.59%,97%{opacity:1}100%{opacity:0}}
@keyframes l6{0%,26.33%{opacity:0}26.34%,97%{opacity:1}100%{opacity:0}}
@keyframes l8{0%,45.35%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(44,end)}58.14%,97%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes l9{0%,62.29%{opacity:0}62.30%,97%{opacity:1}100%{opacity:0}}
@keyframes l10{0%,63.04%{opacity:0}63.05%,97%{opacity:1}100%{opacity:0}}
@keyframes l11{0%,63.79%{opacity:0}63.80%,97%{opacity:1}100%{opacity:0}}
@keyframes l12{0%,64.53%{opacity:0}64.54%,97%{opacity:1}100%{opacity:0}}
@keyframes l13{0%,65.28%{opacity:0}65.29%,97%{opacity:1}100%{opacity:0}}
@keyframes l14{0%,66.03%{opacity:0}66.04%,97%{opacity:1}100%{opacity:0}}
