services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent']
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    # The published agent, at the version package.json depends on. Renovate
    # moves both in one pull request.
    image: ghcr.io/pedronastasi/manychat-ai-agent:{{version}}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      PORT: 3000
    # A directory, never single files: an editor that replaces a file leaves a
    # single-file mount showing the old one. SIGHUP reloads it.
    volumes: ['./config:/app/config:ro']
    # Credentials come from .env, never from this file.
    env_file: [.env]
    ports: ['3000:3000']
    restart: unless-stopped

volumes:
  pgdata:
