services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent']
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      OLLAMA_BASE_URL: http://ollama:11434/v1
      PORT: 3000
    volumes: ['./config:/app/config:ro']
    # Secrets come from a local .env, never from this file.
    env_file: [.env]
    ports: ['3000:3000']
    restart: unless-stopped

  # A local model (specs/007): started only with `--profile local-model`.
  # LOCAL_MODEL picks the model; it is pulled once into the volume.
  ollama:
    image: ollama/ollama
    profiles: [local-model]
    ports: ['11434:11434']
    volumes: ['ollama:/root/.ollama']
    healthcheck:
      # Ready means serving the model, not merely started: `ollama show`
      # fails until the pull below has finished. The image ships no curl or
      # wget, so the probe is the CLI, which asks the same local API.
      test: ['CMD-SHELL', 'ollama show ${LOCAL_MODEL:-llama3.1:8b} >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 360
      start_period: 10s

  # Pulls LOCAL_MODEL into the shared volume once, then exits. A later `up`
  # finds it cached and finishes at once.
  ollama-pull:
    image: ollama/ollama
    profiles: [local-model]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${LOCAL_MODEL:-llama3.1:8b}
    restart: 'no'

volumes:
  pgdata:
  ollama:
