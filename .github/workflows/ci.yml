name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # specs/011-dependency-updates.md § Verification. A bad Renovate config
      # fails silently — the bot just stops opening PRs, which looks exactly
      # like a repository with nothing to update. Run via npx rather than as a
      # devDependency: renovate has 123 direct dependencies, and none of them
      # belong in the install path of everyone who clones this.
      #
      # Pinned to 44.131.0 because renovate 44.131.1 depends on @yarnpkg/core
      # 4.9.2, which was published with a Yarn-only `patch:` specifier for
      # `got` that npm cannot install. npx then exits 1 without printing an
      # error. Remove the pin once a newer renovate installs with
      # `npx --yes --package renovate renovate-config-validator`.
      - name: Validate Renovate config
        run: npx --yes --package renovate@44.131.0 renovate-config-validator

      # The video tests of specs/020 run ffmpeg rather than faking it. They skip
      # on a machine without it, but fail under CI, so a missing binary here
      # breaks the build instead of silently dropping the tests.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Integration tests run against PGlite (real Postgres, in-process), so no
      # service container is needed. Coverage thresholds are enforced here
      # (specs/004-testing.md); the run fails if they regress.
      - name: Test + coverage gate
        run: pnpm test:coverage

      - name: Eval (offline baseline)
        # The golden set runs against the mock provider: deterministic, free, and
        # it catches pipeline regressions without spending on a real model.
        run: pnpm eval:mock
        env:
          AGENT_MODEL: mock:demo
          PUBLIC_BASE_URL: https://ci.example.com
          MANYCHAT_SHARED_SECRET: ci-secret-ci-secret-ci-secret-xx
          DATABASE_URL: pglite
          CONFIG_DIR: test/fixtures/config

      - name: Build
        run: pnpm build

      # specs/014-docs-site.md. The site is built, not deployed, on every pull
      # request: a renamed spec that breaks a link fails the PR that renamed
      # it, rather than the live site afterwards. docs.yml deploys from main.
      - name: Docs build (dead-link check)
        run: pnpm docs:build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Constitution C1: no tenant data or credentials may enter git history.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
